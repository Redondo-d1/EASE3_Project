<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scaredy-Apple Snake</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            border: 5px solid #ecf0f1;
            background-color: #000;
        }
        .stats { font-size: 24px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="stats">Score: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreVal");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        // Start moving RIGHT immediately to prevent instant death
        let dx = 1; 
        let dy = 0;
        let changingDirection = false;

        // Snake body: Head at 10,10; Tail trailing to the left
        let snake = [
            {x: 10, y: 10},
            {x: 9, y: 10},
            {x: 8, y: 10}
        ];

        let apple = {x: 5, y: 5};
        let appleMoveCounter = 0;

        document.addEventListener("keydown", changeDirection);

        function main() {
            if (didGameEnd()) {
                // Game over message
                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.fillText("GAME OVER", canvas.width / 6.5, canvas.height / 2);
                setTimeout(() => location.reload(), 2000);
                return;
            }

            changingDirection = false;
            setTimeout(function onTick() {
                clearCanvas();
                moveApple();
                advanceSnake();
                drawApple();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#2ecc71" : "#27ae60";
                ctx.strokeStyle = "#2c3e50";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (snake[0].x === apple.x && snake[0].y === apple.y) {
                score += 10;
                scoreElement.innerHTML = score;
                createApple();
            } else {
                snake.pop();
            }
        }

        function moveApple() {
            // Apple moves every 2nd frame (half speed of snake)
            appleMoveCounter++;
            if (appleMoveCounter < 2) return;
            appleMoveCounter = 0;

            const head = snake[0];
            const dist = Math.hypot(apple.x - head.x, apple.y - head.y);

            // Scaredy radius: 6 tiles
            if (dist < 6) {
                let moves = [
                    {x: apple.x + 1, y: apple.y},
                    {x: apple.x - 1, y: apple.y},
                    {x: apple.x, y: apple.y + 1},
                    {x: apple.x, y: apple.y - 1}
                ];

                // Keep apple on board
                let validMoves = moves.filter(m => 
                    m.x >= 0 && m.x < tileCount && m.y >= 0 && m.y < tileCount
                );

                // Sort moves by which one is furthest from the snake's head
                validMoves.sort((a, b) => {
                    let distA = Math.hypot(a.x - head.x, a.y - head.y);
                    let distB = Math.hypot(b.x - head.x, b.y - head.y);
                    return distB - distA;
                });

                if (validMoves.length > 0) {
                    apple.x = validMoves[0].x;
                    apple.y = validMoves[0].y;
                }
            }
        }

        function drawApple() {
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath();
            ctx.arc(apple.x * gridSize + gridSize/2, apple.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function createApple() {
            apple.x = Math.floor(Math.random() * tileCount);
            apple.y = Math.floor(Math.random() * tileCount);
            // Don't spawn on snake
            if (snake.some(p => p.x === apple.x && p.y === apple.y)) createApple();
        }

        function changeDirection(event) {
            if (changingDirection) return;
            changingDirection = true;
            
            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === 37 && !goingRight) { dx = -1; dy = 0; }
            if (keyPressed === 38 && !goingDown)  { dx = 0; dy = -1; }
            if (keyPressed === 39 && !goingLeft)   { dx = 1; dy = 0; }
            if (keyPressed === 40 && !goingUp)    { dx = 0; dy = 1; }
        }

        function didGameEnd() {
            // Hit walls
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) return true;
            // Hit self
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        createApple();
        main();
    </script>
</body>
</html>
